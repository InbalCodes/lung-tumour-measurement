name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      # Two public practice scans of one patient (same-day pair) are fetched from TCIA at build
      # time and packed for the "sample scan" buttons. They are never committed to the repository.
      # If TCIA is unreachable the site is still built, without the samples.
      - name: Fetch and pack sample scans
        continue-on-error: true
        run: |
          python3 scripts/download_tcia.py --series \
            1.3.6.1.4.1.9328.50.1.177903673228104341213224928761701786693 \
            1.3.6.1.4.1.9328.50.1.76808802982262101679502232663993705555
          cd app
          node scripts/build_sample.ts \
            baseline@145 "Sample scan 1 (first scan)" ../data/dicom/ct/1.3.6.1.4.1.9328.50.1.177903673228104341213224928761701786693 \
            followup "Sample scan 2 (same patient, repeat scan)" ../data/dicom/ct/1.3.6.1.4.1.9328.50.1.76808802982262101679502232663993705555
      # The image model behind "Boxes (AI)": MedSAM (Apache-2.0), in the ONNX form published with
      # X-AnyLabeling. The files are too large for the repository, so they are fetched at build time
      # and served from this site. If the download fails the site is still built; the tool then
      # reports that the model is not available.
      - name: Fetch image model
        continue-on-error: true
        run: |
          mkdir -p app/public/models
          base=https://github.com/CVHub520/X-AnyLabeling/releases/download/v0.2.0
          curl -fL --retry 3 -o app/public/models/medsam_vit_b.encoder.quant.onnx $base/medsam_vit_b.encoder.quant.onnx
          curl -fL --retry 3 -o app/public/models/medsam_vit_b.decoder.onnx $base/medsam_vit_b.decoder.onnx
      - name: Build
        working-directory: app
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
